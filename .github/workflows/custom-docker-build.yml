name: Publish custom Docker image (Multi-arch)

on:
  push:
    tags:
      - 'v*-custom.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing custom tag to build (for example, v1.0.0-rc.21-custom.1)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Existing custom tag to build'
        required: true
        type: string

env:
  IMAGE_NAME: jitongyu0607/api

jobs:
  build_single_arch:
    name: Build & push custom image (${{ matrix.arch }})
    if: github.repository == 'qsmy0607/new-api'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: read

    steps:
      - name: Check out custom tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag and write VERSION
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag '$TAG' does not exist"
              exit 1
            fi
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi

          case "$TAG" in
            v*-custom.*) ;;
            *)
              echo "::error::Custom release tags must match v*-custom.*"
              exit 1
              ;;
          esac

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "$TAG" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push architecture image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG }}-${{ matrix.arch }}
            ${{ env.IMAGE_NAME }}:latest-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  create_manifests:
    name: Create custom multi-arch manifests
    needs: [build_single_arch]
    if: github.repository == 'qsmy0607/new-api'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push version manifest
        env:
          TAG: ${{ needs.build_single_arch.outputs.tag }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE_NAME:$TAG" \
            "$IMAGE_NAME:$TAG-amd64" \
            "$IMAGE_NAME:$TAG-arm64"

      - name: Create and push latest manifest
        run: |
          docker buildx imagetools create \
            -t "$IMAGE_NAME:latest" \
            "$IMAGE_NAME:latest-amd64" \
            "$IMAGE_NAME:latest-arm64"

      - name: Inspect custom manifest
        env:
          TAG: ${{ needs.build_single_arch.outputs.tag }}
        run: docker buildx imagetools inspect "$IMAGE_NAME:$TAG"
